[project]
name = "medirappel"
version = "0.1.0"
description = "Rappels de rendez-vous par SMS (SMSGate) pour un cabinet dentaire, auto-heberge."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
