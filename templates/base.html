<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e4d">
<title>{% block title %}MediRappel{% endblock %}</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css?v={{ css_v }}">
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a href="/" class="brand"><img src="/static/favicon.png" alt="" width="30" height="30">MediRappel</a>
    {% if user %}
    <span class="who">{{ user['name'] }}</span>
    <form method="post" action="/logout" class="logout"><button type="submit">Se déconnecter</button></form>
    {% endif %}
  </div>
</header>
{% block body %}{% endblock %}
{% if user %}<footer class="foot"><a href="/diagnostic">Diagnostic</a></footer>{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
